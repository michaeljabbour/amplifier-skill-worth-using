<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Worth Using</title><desc id="desc">Useful to someone who isn't you. Six criteria, each rated with its evidence. An illustrative usefulness card, not measured data.</desc><rect width="1200" height="630" fill="#f6f4ee"/><path d="M60 94H1140M60 560H1140" stroke="#d8d8cc"/><text x="60" y="62" font-family="Arial, sans-serif" font-size="20" fill="#64685e">An Amplifier skill</text><text x="60" y="255" font-family="Georgia, serif" font-size="96" letter-spacing="-4" fill="#252823">Worth</text><text x="60" y="352" font-family="Georgia, serif" font-size="96" letter-spacing="-4" fill="#252823">Using</text><text x="64" y="425" font-family="Arial, sans-serif" font-size="25" fill="#64685e">Useful to someone who isn't you.</text><text x="64" y="464" font-family="Arial, sans-serif" font-size="25" fill="#64685e">Every rating carries its evidence.</text><rect x="700" y="140" width="420" height="350" fill="#efeee7" stroke="#d8d8cc"/><g font-family="Georgia, serif" font-size="22" fill="#252823"><text x="730" y="190">Job</text><text x="730" y="240">First value</text><text x="730" y="290">Fit</text><text x="730" y="340">Outcome</text><text x="730" y="390">Trust</text><text x="730" y="440">Return</text></g><g fill="#3f6b4a"><rect x="900" y="172" width="180" height="22"/><rect x="900" y="222" width="180" height="22"/><rect x="900" y="272" width="180" height="22"/><rect x="900" y="322" width="180" height="22"/><rect x="900" y="372" width="120" height="22" opacity=".6"/><rect x="900" y="422" width="60" height="22" opacity=".35"/></g><circle cx="960" cy="433" r="20" fill="none" stroke="#80642f" stroke-width="3"/><text x="700" y="525" font-family="Arial, sans-serif" font-size="17" fill="#64685e">Illustrative card. Never added up.</text></svg>
